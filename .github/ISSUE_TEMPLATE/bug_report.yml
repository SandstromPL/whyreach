name: Bug report
description: whyreach got something wrong, crashed, or gave an answer that didn't help.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Issues are public, so please remove anything private first: your addresses, host names, user names and anything else you don't want to share.
        For a security problem, don't open an issue: see [SECURITY.md](https://github.com/SandstromPL/whyreach/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, or what you asked your agent, and what whyreach answered.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the real cause was, if you know it, and how you found it.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: How to reproduce it
      description: A small Compose file or the docker commands that set it up. Made-up names are fine.
      render: yaml
  - type: input
    id: version
    attributes:
      label: whyreach version
      description: The output of `whyreach --version`.
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker version
      description: "The output of `docker version --format '{{.Server.Version}}'`."
  - type: input
    id: os
    attributes:
      label: OS and kernel
      description: For example "Ubuntu 24.04, kernel 6.8". `uname -sr` prints the kernel.
  - type: dropdown
    id: how
    attributes:
      label: How you ran whyreach
      multiple: true
      options:
        - CLI
        - Through an MCP client (name it above)
        - The container image
        - As root
  - type: textarea
    id: report
    attributes:
      label: Redacted report (optional, but very useful)
      description: |
        Run the diagnosis again with `--report`, find its ID with `whyreach report list`, then run `whyreach report export ID`. Check the redacted copy, `ID.tar.gz`, then attach it here.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed private details I don't want public.
          required: true
