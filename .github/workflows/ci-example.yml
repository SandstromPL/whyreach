# CI mode's example (docs/ci.md), on GitHub's own runner. TestCIExample
# reads the example's steps from docs/ci.md and runs their scripts against
# a deliberately broken Compose stack (test/lab/wr002-loopback-bind), with
# probe containers, as the example does. The install step's download is
# answered from a release the test builds from this commit, so nothing is
# downloaded; started by hand with a version, the test downloads that
# release from GitHub Releases instead.
name: ci example

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "A published release to install, such as 0.2.0 (empty: build one from this commit)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-example-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    name: the CI example against a broken stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -tags lab -count=1 -run '^TestCIExample$' -v ./test/e2e
        env:
          WHYREACH_CI_RELEASE: ${{ inputs.release }}
