# WR007 (promoted from spikes/experiments/e1.yaml): worker is configured with
# localhost:8080, but the service runs in api, on the shared network.
x-server: &server
  image: ${WHYREACH_LAB_IMAGE:?set by the lab harness}
  pull_policy: never
  labels: { io.whyreach.lab: "1" }
  healthcheck: &health
    test: ["CMD", "/labserver", "check", "127.0.0.1:7000"]
    interval: 30s
    start_period: 10s
    start_interval: 200ms

services:
  api:
    <<: *server
    command: ["serve", "0.0.0.0:8080"]
    healthcheck:
      <<: *health
      test: ["CMD", "/labserver", "check", "127.0.0.1:8080"]
  worker:
    <<: *server
    command: ["serve", "0.0.0.0:7000"]

networks:
  default:
    labels: { io.whyreach.lab: "1" }
