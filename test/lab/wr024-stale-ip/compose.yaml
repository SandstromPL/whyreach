# WR024: worker connects to an address on its own network that no container
# holds, like a container IP hard-coded in its configuration before the
# container was recreated with another one. Nothing answers there: the
# connect fails with "no route to host" once ARP gives up, after about 3 s,
# so whyreach's 2 s connect times out first. Until v0.2 this scenario was
# inconclusive-stale-ip, which no v0.1 rule could claim.
x-server: &server
  image: ${WHYREACH_LAB_IMAGE:?set by the lab harness}
  pull_policy: never
  labels: { io.whyreach.lab: "1" }
  healthcheck: &health
    test: ["CMD", "/labserver", "check", "127.0.0.1:7000"]
    interval: 30s
    start_period: 10s
    start_interval: 200ms

services:
  api:
    <<: *server
    command: ["serve", "0.0.0.0:8080"]
    healthcheck:
      <<: *health
      test: ["CMD", "/labserver", "check", "127.0.0.1:8080"]
  worker:
    <<: *server
    command: ["serve", "0.0.0.0:7000"]

networks:
  default:
    labels: { io.whyreach.lab: "1" }
