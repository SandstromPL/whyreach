# WR010 (promoted from spikes/experiments/e4.yaml's slow starter): api waits ten
# minutes before it listens, and its healthcheck stays "starting" meanwhile.
x-server: &server
  image: ${WHYREACH_LAB_IMAGE:?set by the lab harness}
  pull_policy: never
  labels: { io.whyreach.lab: "1" }
  healthcheck: &health
    test: ["CMD", "/labserver", "check", "127.0.0.1:7000"]
    interval: 30s
    start_period: 10s
    start_interval: 200ms

services:
  api:
    <<: *server
    command: ["serve", "--delay", "600s", "0.0.0.0:8080"]
    healthcheck:
      test: ["CMD", "/labserver", "check", "127.0.0.1:8080"]
      interval: 30s
      start_period: 600s
      start_interval: 1s
  worker:
    <<: *server
    command: ["serve", "0.0.0.0:7000"]

networks:
  default:
    labels: { io.whyreach.lab: "1" }
