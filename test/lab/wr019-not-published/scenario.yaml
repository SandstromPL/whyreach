description: web listens on the port inside its container but does not publish it; the host connects to localhost
from: host
to: localhost:${LAB_PORT}
expect:
  verdict: cause_identified
  top_rule: WR019
  confidence: high
  fix_contains: ports
  must_not_fire: [WR002, WR007, WR012]
  tcp_outcomes: ["hosts:refused"]
# From the host, probes run in-process: no probe container either way.
expect_without_probe:
  verdict: cause_identified
  top_rule: WR019
  confidence: high
# On Docker Desktop without probe containers, whyreach can't read web's
# sockets, so it can't see that web serves the port: "nothing on the host
# listens" is only likely (a gap says why), and the fix still says to
# publish the port if the service runs in a container.
expect_desktop_without_probe:
  verdict: likely_cause
  top_rule: WR001
  confidence: medium
  fix_contains: publish its port
