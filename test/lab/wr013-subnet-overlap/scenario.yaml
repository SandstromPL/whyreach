description: the host connects to an address in the project network's subnet that no container holds
from: host
to: ${UNUSED_IP}:8080
# WR013 needs no probe (the host's route lookup decides), and from the host
# the connect runs in-process either way: the same with the default config.
# No route but Docker's covers the address, so it is medium.
expect:
  verdict: likely_cause
  top_rule: WR013
  confidence: medium
  fix_contains: is a machine on your LAN or VPN
  must_not_fire: [WR001, WR004, WR015, WR019, WR021, WR024]
  # The connect times out (whyreach gives up before ARP does): the route
  # explains it, so WR016 is only suppressed.
  suppressed: {WR016: WR013}
# The second run starts while ARP for the address is still under way, so
# its connect may get "no route to host" before whyreach's 2 s timeout:
# then WR016 has no timeout to judge, and only the first run checks it.
expect_without_probe:
  verdict: likely_cause
  top_rule: WR013
  confidence: medium
expect_on:
  wsl2-desktop:
    why: Docker Desktop's VM routes the containers' traffic, so the route record is a gap
    verdict_in: [inconclusive]
    must_not_fire: [WR013]
