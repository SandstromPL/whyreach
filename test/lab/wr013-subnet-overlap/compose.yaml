# WR013, the medium case: the host connects to an address in this project's
# network that no container holds, standing in for a machine on a VPN or a
# LAN whose range Docker's network took. The host's routing table sends it
# into the network's bridge, where nothing answers. A VPN's own route,
# which makes WR013 high, can't be added without changing the host's
# routes: fixtures and the route lookup's test in a network namespace cover
# that case.
x-server: &server
  image: ${WHYREACH_LAB_IMAGE:?set by the lab harness}
  pull_policy: never
  labels: { io.whyreach.lab: "1" }
  healthcheck: &health
    test: ["CMD", "/labserver", "check", "127.0.0.1:7000"]
    interval: 30s
    start_period: 10s
    start_interval: 200ms

services:
  api:
    <<: *server
    command: ["serve", "0.0.0.0:8080"]
    healthcheck:
      <<: *health
      test: ["CMD", "/labserver", "check", "127.0.0.1:8080"]

networks:
  default:
    labels: { io.whyreach.lab: "1" }
