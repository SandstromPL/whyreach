# WR012 (promoted from spikes/experiments/e5.yaml's host listener): the service
# on the host listens on 127.0.0.1 only; client reaches the host through
# host-gateway, which arrives at the docker0 address.
x-server: &server
  image: ${WHYREACH_LAB_IMAGE:?set by the lab harness}
  pull_policy: never
  labels: { io.whyreach.lab: "1" }
  healthcheck: &health
    test: ["CMD", "/labserver", "check", "127.0.0.1:7000"]
    interval: 30s
    start_period: 10s
    start_interval: 200ms

services:
  client:
    <<: *server
    command: ["serve", "0.0.0.0:7000"]
    extra_hosts: ["host.docker.internal:host-gateway"]

networks:
  default:
    labels: { io.whyreach.lab: "1" }
