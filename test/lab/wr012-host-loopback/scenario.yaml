description: a host service listens only on 127.0.0.1, so client can not reach it through host.docker.internal
host_listen: [loopback]
from: service:client@${PROJECT}
to: host.docker.internal:${HOST_PORT}
expect:
  verdict: cause_identified
  top_rule: WR012
  confidence: high
  must_not_fire: [WR011, WR006]
  tcp_outcomes: ["hosts:refused"]
# The host's listeners settle it without a probe.
expect_without_probe:
  verdict: cause_identified
  top_rule: WR012
  confidence: high
# On Docker Desktop's WSL integration the host the client reaches is
# Windows, not the WSL2 VM where the harness listens: whyreach can't read
# Windows' listeners, so WR012 must stay quiet and leave a gap.
expect_on:
  wsl2-desktop:
    why: the host Docker Desktop's containers reach is Windows, whose listeners whyreach can't read
    verdict_in: [no_problem_reproduced, inconclusive]
    must_not_fire: [WR011, WR012, WR001]
