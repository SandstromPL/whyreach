# Must stay inconclusive (INITIAL.md §6.3): api accepts every connection and
# closes it at once, as a server that rejects its clients does. The network
# path and the listener are fine; no network rule may claim it.
x-server: &server
  image: ${WHYREACH_LAB_IMAGE:?set by the lab harness}
  pull_policy: never
  labels: { io.whyreach.lab: "1" }
  healthcheck: &health
    test: ["CMD", "/labserver", "check", "127.0.0.1:7000"]
    interval: 30s
    start_period: 10s
    start_interval: 200ms

services:
  api:
    <<: *server
    command: ["serve", "--close", "0.0.0.0:8080"]
    healthcheck:
      <<: *health
      test: ["CMD", "/labserver", "check", "127.0.0.1:8080"]
  worker:
    <<: *server
    command: ["serve", "0.0.0.0:7000"]

networks:
  default:
    labels: { io.whyreach.lab: "1" }
