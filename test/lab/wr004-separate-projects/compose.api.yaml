# WR004 (promoted from spikes/experiments/e2a.yaml): api in a project of its own.
services:
  api:
    image: ${WHYREACH_LAB_IMAGE:?set by the lab harness}
    pull_policy: never
    labels: { io.whyreach.lab: "1" }
    command: ["serve", "0.0.0.0:8080"]
    healthcheck:
      test: ["CMD", "/labserver", "check", "127.0.0.1:8080"]
      interval: 30s
      start_period: 10s
      start_interval: 200ms

networks:
  default:
    labels: { io.whyreach.lab: "1" }
