# The asker's Compose file. app1-app3 (a Node.js app, `build: .`) and mongo
# run the stand-in; haproxy runs the image the asker's Dockerfile starts
# from, with their haproxy.conf where the Dockerfile copies it.
version: "3"
services:
  app1:
    container_name: whyreach-lab-${REALCASE_PROJECT}-app1
    restart: always
    image: ${WHYREACH_LAB_IMAGE:?set by the lab harness}
    pull_policy: never
    command: ["serve", "0.0.0.0:8001"]
    ports:
      - "8001"
    links:
      - mongo
    networks:
      - my-net
    labels: { io.whyreach.lab: "1" }

  app2:
    container_name: whyreach-lab-${REALCASE_PROJECT}-app2
    restart: always
    image: ${WHYREACH_LAB_IMAGE:?set by the lab harness}
    pull_policy: never
    command: ["serve", "0.0.0.0:8001"]
    ports:
      - "8001"
    links:
      - mongo
    networks:
      - my-net
    labels: { io.whyreach.lab: "1" }

  app3:
    container_name: whyreach-lab-${REALCASE_PROJECT}-app3
    restart: always
    image: ${WHYREACH_LAB_IMAGE:?set by the lab harness}
    pull_policy: never
    command: ["serve", "0.0.0.0:8001"]
    ports:
      - "8001"
    links:
      - mongo
    networks:
      - my-net
    labels: { io.whyreach.lab: "1" }

  mongo:
    container_name: whyreach-lab-${REALCASE_PROJECT}-mongo
    image: ${WHYREACH_LAB_IMAGE:?set by the lab harness}
    pull_policy: never
    command: ["serve", "0.0.0.0:27017"]
    ports:
      - "27017"
    networks:
      - my-net
    labels: { io.whyreach.lab: "1" }

  haproxy:
    image: haproxytech/haproxy-alpine:2.4
    configs:
      - source: haproxy_conf
        target: /usr/local/etc/haproxy/haproxy.conf
    container_name: whyreach-lab-${REALCASE_PROJECT}-haproxy
    links:
      - app1
      - app2
      - app3
    ports:
      - "${LAB_PORT}:80"
      - "8404"
    networks:
      - my-net
    labels: { io.whyreach.lab: "1" }

networks:
  my-net:
    name: whyreach-lab-${REALCASE_PROJECT}-my-net
    driver: bridge
    labels: { io.whyreach.lab: "1" }

configs:
  haproxy_conf:
    file: ./haproxy.conf
