source: https://forums.docker.com/t/139130
author: xevimerino
asked: >-
  A Monica CRM stack taken from the official repository's example folder (app on
  PHP-FPM port 9000 with nothing published, MariaDB, Redis, cron, queue, web, an
  Nginx proxy publishing 80 and 443, a Let's Encrypt companion) answers the
  browser with "503 Service Temporarily Unavailable" although every service is
  up; the Nginx upstream is server app:9000.
up_wait: true
settle_seconds: 10
from: host
to: localhost:${LAB_PORT}
symptom: failure
images: [nginx:stable-alpine, redis:7-alpine]
stubbed:
  - what: app, Monica CRM on PHP-FPM (build ./app, image monica-app)
    how: the stand-in, listening on 0.0.0.0:9000
    why: >-
      not an allowed image and no build; the question says the app uses port
      9000 internally, PHP-FPM's port, and PHP-FPM's images listen on all
      addresses
  - what: db, MariaDB
    how: the stand-in, listening on 0.0.0.0:3306
    why: MariaDB isn't an allowed image; only its existence on the network matters here
  - what: cron and queue, Monica's scheduler and queue worker
    how: the stand-in, listening on 127.0.0.1:3000 only
    why: >-
      they listen on nothing; the stand-in must listen somewhere to stay up, so
      loopback only, where nothing else can reach it
  - what: web, a service the question names without saying what it runs
    how: the stand-in, listening on 0.0.0.0:80
    why: its image and role aren't given; a web server's default port
  - what: proxy, Nginx built from ./proxy
    how: nginx:stable-alpine with the question's upstream in conf.d/default.conf
    why: no build; the Dockerfile in ./proxy isn't shown
  - what: the Let's Encrypt companion
    how: the stand-in, listening on 127.0.0.1:3000 only
    why: it listens on nothing; not an allowed image
assumptions:
  - >-
    The failing client is the asker's browser on the host, so from is host; the
    question doesn't give the address the browser used, so to is the proxy's
    published port 80 on localhost.
  - >-
    symptom is failure: the asker saw an HTTP response, "503 Service Temporarily
    Unavailable", which means the proxy answered; the question names no
    connection-level failure (refused, timeout, unresolved name).
  - >-
    The question's Compose file is shown only in snippets ("..."), taken from the
    official repository's example folder, which isn't shown; only what the
    question shows or says is rebuilt. Volumes, environment (the .env file),
    restart policies and the builds' contents aren't given and are left out.
  - >-
    The question doesn't say which service loads the Nginx configuration with
    upstream php-handler { server app:9000; }. The asker calls the proxy the
    Nginx service and says they checked that "the Monica app and Nginx proxy"
    can talk, so it goes in proxy.
  - >-
    Only the upstream block is shown; the server block around it (listen 80,
    every request passed to php-handler over FastCGI, since port 9000 is
    PHP-FPM's) is filled in.
  - >-
    No networks are shown, so every service is on the project's default network.
  - >-
    proxy publishes 80:80 and 443:443; 80's host side becomes ${LAB_PORT}, and
    443 is published on a port Docker picks, since only one lab port is given.
    Nothing in the rebuilt proxy listens on 443 (its TLS setup isn't shown).
  - >-
    proxy depends on app so Nginx can resolve app at start: the asker says all
    services are up, and Nginx exits at start if the upstream's name doesn't
    resolve yet.
  - >-
    The Let's Encrypt companion's service name isn't given; it is called
    letsencrypt-companion. Redis's image tag isn't given; redis:7-alpine.
read:
  - bin/realcases/raw/forum-139130/question.md
  - bin/realcases/raw/forum-139130/meta.json
  - test/realcases/README.md
