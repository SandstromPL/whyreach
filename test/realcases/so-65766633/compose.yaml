# Rebuilt from https://stackoverflow.com/questions/65766633 (gary), CC BY-SA 4.0.
# The Angular app is served by nginx-files-ui and runs in the browser, which
# calls the Spring Boot API at http://files-service:8080.
services:
  nginx-files-ui:
    image: nginx:stable-alpine
    container_name: whyreach-lab-${REALCASE_PROJECT}-nginx-files-ui
    ports:
      - "${LAB_PORT}:80"
    labels: { io.whyreach.lab: "1" }

  files-service:
    image: ${WHYREACH_LAB_IMAGE:?set by the lab harness}
    pull_policy: never
    command: ["serve", "0.0.0.0:8080"]
    ports:
      - "8080"
    labels: { io.whyreach.lab: "1" }

networks:
  default:
    name: whyreach-lab-${REALCASE_PROJECT}-files-net
    labels: { io.whyreach.lab: "1" }
