  url: https://stackoverflow.com/questions/69437475
  case: so-69437475
  decision: in
  cause: The Node.js app in the api container connected to localhost:22 to reach the SSH server of the
    machine running Docker (the asker's WSL distro); inside the container localhost is the container itself,
    where nothing listens on 22.
  connection:
    from: the api container (node-ssh client)
    to: localhost:22
    symptom: refused
  rule: WR007
  fix: Connect to host.docker.internal:22 instead of localhost (the asker also dropped the attempt to
    run sshd in the container and switched node:alpine to node:latest).
  fix_source: 'comment by the asker (rewrewty1): ''Now I can connect WSL''s SSH from docker container
    with host.docker.internal'', following a comment by Stefan Golubović; also the [SOLUTION] update in
    the question'
  label_confidence: medium
  notes: 'Asker is on WSL2 (host.docker.internal worked out of the box and Windows'' netstat showed 22
    held by wslhost.exe, so Docker Desktop''s WSL integration); the cause, localhost inside a container,
    is the same on Linux, where the fix also needs extra_hosts host.docker.internal:host-gateway and an
    sshd on 0.0.0.0:22. The asker''s comments: 0.0.0.0 failed the same way, the WSL VM''s own address
    (172.30.x.x) worked, and host.docker.internal fixed it. They also call the accepted answer''s point
    (sshd doesn''t start on alpine) their ''first problem'', from a detour where they tried running sshd
    in the container; the final Dockerfile runs no sshd, and the connection that failed and was fixed
    is the one to WSL''s sshd. A ''Permission denied'' login error on the way was auth over a working
    connection. Rebuild: a host listener on the port (stand-in for sshd), the container connecting to
    localhost.'
  selected: true
- source: stackoverflow
  position: 3
  url: https://stackoverflow.com/questions/71877179
  case: so-71877179
  decision: in
  cause: 'On the droplet the images were started one by one with plain docker run: every container sat
    only on Docker''s default bridge (no name resolution) and got a random name, so the name dbcontainer
    (the image''s tag and the Compose container_name, not any running container''s name) did not resolve
    from the server container.'
  connection:
    from: the node-express server container (started with docker run, random name)
    to: dbcontainer:3306
    symptom: name-not-found
  rule: WR009
  also: WR005
  fix: Run the stack on the droplet with docker-compose (images referenced from the registry), which puts
    the containers on the user-defined network mynetwork and names the database container dbcontainer.
  fix_source: the asker's own answer (accepted)
  label_confidence: medium
  notes: 'Both causes had to go and the fix removed both at once: the default bridge (WR009) and no container
    named dbcontainer (WR005; both layer 3, WR009 earlier in evaluation order). WR009''s page assumes
    the name matches a container on the bridge; here it matched only an image tag (docker ps shows friendly_ardinghelli
    for the db), and WR005''s page says it does not fire for a source on the default bridge only, so a
    faithful rebuild may leave whyreach with no matching rule. Rebuild from the docker ps output: docker
    run -d -p 3307:3306 <db image>, docker run -d -p 4000:4000 <server image>, phpmyadmin -p 8183:80,
    all without --name or --network. mysql client default port 3306 (no port in the pool config). Docker
    19.03.12 on Ubuntu. phpMyAdmin''s PMA_PORT 3307 is a separate WR006 leftover, not the failing connection.'
  selected: true
