  url: https://stackoverflow.com/questions/71090070
  case: so-71090070
  decision: out
  out_reason: platform
  cause: Redis Cluster nodes advertise their container addresses (10.0.0.11-16:6379) in the cluster topology;
    Lettuce on the host follows that topology after the seed connect to localhost:7001 and cannot reach
    those addresses.
  connection:
    from: the Java (Lettuce) app on the host
    to: 10.0.0.12:6379 (and the other nodes' container addresses, learned from the cluster topology; seeds
      were localhost:7001-7003)
    symptom: timeout
  fix: Switched to bitnami/redis-cluster with REDIS_CLUSTER_ANNOUNCE_IP set to the host's LAN address
    and announce ports equal to the published ports, so the topology advertises addresses the host can
    reach.
  fix_source: the asker's own answer (accepted)
  label_confidence: medium
  notes: The class of cause is the planned WR025 (advertised-address redirect). But on Linux Docker Engine
    the host routes to a bridge network's subnet (10.0.0.0/16 here) and reaches container addresses directly,
    so the host's connects to 10.0.0.x:6379 would succeed; timeouts from the host to container addresses
    are Docker Desktop behaviour. The asker's LAN is 192.168.0.x, so no subnet overlap explains it. The
    asker's OS is not stated, hence medium.
  selected: false
